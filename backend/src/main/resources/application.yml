server:
  # 8080 Mokili, 8081 Umoja
  port: ${SERVER_PORT:8082}
  forward-headers-strategy: framework
  servlet:
    context-path: /oro
  # on a stop (SIGTERM): the streams told to reconnect and closed, the outbox stopped (both before the server),
  # then the requests in flight finished, 20 s at most. Docker waits 45 s before it kills (stop_grace_period)
  shutdown: graceful
info:
  app:
    name: '@project.name@'
    version: '@project.version@'
    description: '@project.description@'
spring:
  application:
    name: Oro - Messaging
  lifecycle:
    timeout-per-shutdown-phase: 20s
  task:
    scheduling:
      # a stop lets the jobs running (a scan, an outbox batch, a purge) finish instead of interrupting them
      shutdown:
        await-termination: true
        await-termination-period: 10s
  servlet:
    multipart:
      # oro.attachments.max-size-bytes, and a little for the form
      max-file-size: 100MB
      max-request-size: 101MB
      # where an upload is received before it is stored: the data volume (ORO_MULTIPART_DIR), not the disk of the
      # system; unset: the temporary directory of the server. Deleted after each request
      location: ${ORO_MULTIPART_DIR:}
  mvc:
    async:
      # the streams (Server-Sent Events) end by themselves (LiveHub.STREAM_TIMEOUT)
      request-timeout: -1
  jpa:
    open-in-view: false
    hibernate:
      # the schema is the one of 1_ASATA_DATABASE/CREATE_ORO_TABLES.sql, never generated
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        query:
          timeout: 10000
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/asata}
    # the API's login: NOINHERIT, a member of oro_app only (see DbSession, DataSourceConfig); never a superuser: it
    # bypasses RLS
    username: ${SPRING_DATASOURCE_USERNAME:oro_api}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      # the load test (backend/perf): on 2 CPUs the connections wait for the CPU, not the other way round; more
      # connections only queue more work in PostgreSQL. A connection not free within connection-timeout: 503
      maximum-pool-size: ${ORO_DB_POOL_SIZE:10}
      connection-timeout: 5000
      validation-timeout: 3000
springdoc:
  # the API description and Swagger UI: off unless ORO_API_DOCS=true (development); never in production
  api-docs:
    enabled: ${ORO_API_DOCS:false}
    path: /doc/api
    version: openapi_3_0
  swagger-ui:
    enabled: ${ORO_API_DOCS:false}
    operations-sorter: method
    path: /doc
    url: /doc/api
management:
  # the actuator on its own port, never published: Prometheus reads it on the private network (9082); the health too
  server:
    port: ${ORO_MANAGEMENT_PORT:9082}
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      # the details (database...) to nobody
      show-details: never
      # /actuator/health/liveness and /readiness (readiness: the database too)
      probes:
        enabled: true
      group:
        # ready: accepting traffic and the database answering (both logins). Live: the process answers; a database
        # down makes Oro not ready, never restarts it (backend/docker/healthcheck.sh)
        readiness:
          include: readinessState, db
  health:
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: oro
    distribution:
      # the percentiles in Prometheus (histogram_quantile): the requests, a send
      percentiles-histogram:
        http.server.requests: true
        oro.messages.send: true
        oro.conversation.lock: true
oro:
  # the worker's login, for the integrations and the workers: NOINHERIT, a member of oro_system only; the same database
  system-datasource:
    driver-class-name: org.postgresql.Driver
    url: ${ORO_SYSTEM_DATASOURCE_URL:${spring.datasource.url}}
    username: ${ORO_SYSTEM_DATASOURCE_USERNAME:oro_worker}
    password: ${ORO_SYSTEM_DATASOURCE_PASSWORD:}
    hikari:
      # the outbox worker, the integrations, the scans and purges: all 5 busy, 2 waiting at the load test's worst (a
      # group of 500 sending 10 messages a second); the outbox lag stayed under 2 s up to 1,500 users, 7.7 s at 3,000
      maximum-pool-size: ${ORO_WORKER_DB_POOL_SIZE:5}
      connection-timeout: 5000
      validation-timeout: 3000
  # the accounts' login (oro_auth, a member of oro_account only): the sign-in into Asata accounts, nothing of the
  # messaging; the same database
  account-datasource:
    driver-class-name: org.postgresql.Driver
    url: ${ORO_ACCOUNT_DATASOURCE_URL:${spring.datasource.url}}
    username: ${ORO_ACCOUNT_DATASOURCE_USERNAME:oro_auth}
    password: ${ORO_ACCOUNT_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: ${ORO_ACCOUNT_DB_POOL_SIZE:4}
      connection-timeout: 5000
      validation-timeout: 3000
  # the accounts of Oro: its people sign in with their Asata account (asata_user, shared with Umoja and Mokili), Oro
  # signs their access tokens with its own key and publishes the public ones (/.well-known/jwks.json)
  accounts:
    # the RSA private key, PKCS#8 on one line:
    #   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 | openssl pkcs8 -topk8 -nocrypt -outform DER | base64
    # unset: a new key at each start (development only: ProductionChecks refuses it)
    signing-key: ${ORO_ACCOUNTS_SIGNING_KEY:}
    # a rotation: the former key (same form), published and accepted until its tokens expired (15 min)
    previous-keys: ${ORO_ACCOUNTS_PREVIOUS_KEYS:}
    access-token-ttl: 15m
    # the session ends with the browser; "keep me signed in": remember-ttl
    session-ttl: 12h
    remember-ttl: 30d
    # a refresh token just replaced stays usable this long (two tabs refreshing together)
    reuse-grace: 30s
    cookie-secure: ${ORO_COOKIE_SECURE:true}
    # the same counters as Umoja and Mokili (asata_user_credential): 5 wrong passwords lock the account 15 minutes
    max-failed-attempts: 5
    lock-duration: 15m
  security:
    cors-allowed-origins: ${ORO_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}
    products:
      # integration-keys: the keys of each product's trusted integration (/internal), as name:sha256 (the SHA-256 of the
      # key in hex, never the key: printf %s "$KEY" | shasum -a 256), comma separated; two during a rotation
      # each product signs the access tokens of its users (RS256) with its own private key; Oro reads its public keys
      # (a JWK set) and checks the issuer and the audience oro. Unset: that product's users cannot call Oro
      ORO:
        issuer: oro
        # unset: Oro's own accounts sign them (oro.accounts), checked with their public keys, in the same process
        jwk-set-uri: ${ORO_JWKS_URI:}
        integration-keys: ${ORO_INTEGRATION_KEYS:}
      UMOJA:
        # as Umoja issues them: umoja.security.jwt.issuer, and its keys on /umoja/.well-known/jwks.json
        issuer: umoja
        jwk-set-uri: ${UMOJA_JWKS_URI:http://localhost:8081/umoja/.well-known/jwks.json}
        integration-keys: ${UMOJA_INTEGRATION_KEYS:}
  # how many requests a user makes (its token: issuer and subject), in this instance: per-minute a minute after a burst;
  # any for every request, the others on top. Over: 429 and Retry-After
  rate-limits:
    enabled: ${ORO_RATE_LIMITS:true}
    limits:
      any: { per-minute: 300, burst: 100 }
      send: { per-minute: 60, burst: 20 }
      change-message: { per-minute: 30, burst: 10 }
      react: { per-minute: 60, burst: 20 }
      typing: { per-minute: 30, burst: 5 }
      search: { per-minute: 20, burst: 5 }
      open-direct: { per-minute: 20, burst: 10 }
      create-group: { per-minute: 3, burst: 5 }
      add-member: { per-minute: 30, burst: 20 }
      upload: { per-minute: 10, burst: 5 }
      stream: { per-minute: 10, burst: 5 }
  outbox:
    enabled: ${ORO_OUTBOX_ENABLED:true}
    poll-interval: PT1S
    batch-size: 100
    lease: PT30S
    max-attempts: 10
    base-backoff: PT1S
    max-backoff: PT1H
    retention: P7D
    purge-interval: PT1H
  attachments:
    # 100 MiB; the database refuses more than 2 GiB anyway
    max-size-bytes: 104857600
    # local: the files on a disk (local-dir), for development and single-server installs; an object storage (s3...)
    # needs its FileStorage, until then nothing can be uploaded
    storage-provider: ${ORO_STORAGE_PROVIDER:local}
    local-dir: ${ORO_ATTACHMENTS_DIR:./data/attachments}
    # clamav: each file is scanned by clamd (below) before it is downloadable, fail closed (pending while clamd is away,
    # scanned again every minute; infected: refused and deleted). none: no scanner, a file is recorded clean unscanned
    # (development only, never in production)
    scan: ${ORO_ATTACHMENTS_SCAN:none}
    clamav:
      host: ${ORO_CLAMAV_HOST:localhost}
      port: ${ORO_CLAMAV_PORT:3310}
      # a file of max-size-bytes, scanned; clamd's StreamMaxLength, MaxFileSize and MaxScanSize must cover it too
      timeout: PT2M
      retry-interval: PT1M
    # what a user may upload: the bytes of its files not deleted, its files of the last 24 hours (413, 429 beyond)
    quota:
      bytes-per-user: ${ORO_ATTACHMENTS_QUOTA_BYTES:1073741824}
      files-per-day: ${ORO_ATTACHMENTS_QUOTA_FILES_PER_DAY:200}
    # the files Oro no longer keeps, removed every interval: of deleted messages at once, uploads never attached after
    # abandoned-after, uploads never received after pending-after; the files without an attachment every day
    purge:
      enabled: ${ORO_ATTACHMENTS_PURGE:true}
      interval: PT15M
      abandoned-after: PT24H
      pending-after: PT1H
    # the local storage keeps this much of its disk free (503 beyond)
    local-min-free-bytes: ${ORO_ATTACHMENTS_MIN_FREE_BYTES:1073741824}
  # what the metrics read (OroMetrics): the age of the last backup of the files, from the file the backup writes
  monitoring:
    files-backup-status: ${ORO_FILES_BACKUP_STATUS:}
  live:
    # a comment on every stream, so that the proxies keep them open
    heartbeat: PT25S
    # the streams of a user (its tabs and devices), and of this instance: the next one is refused (429, 503)
    max-streams-per-user: 5
    max-streams: 10000
    # an outbox event older than this is not sent: its recipients' streams reconnect and read again what changed
    event-ttl: PT2M
