server:
  # 8080 Mokili, 8081 Umoja
  port: ${SERVER_PORT:8082}
  forward-headers-strategy: framework
  servlet:
    context-path: /oro
info:
  app:
    name: '@project.name@'
    version: '@project.version@'
    description: '@project.description@'
spring:
  application:
    name: Oro - Messaging
  servlet:
    multipart:
      # oro.attachments.max-size-bytes, and a little for the form
      max-file-size: 100MB
      max-request-size: 101MB
  mvc:
    async:
      # the streams (Server-Sent Events) end by themselves (LiveHub.STREAM_TIMEOUT)
      request-timeout: -1
  jpa:
    open-in-view: false
    hibernate:
      # the schema is the one of 1_ASATA_DATABASE/CREATE_ORO_TABLES.sql, never generated
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        query:
          timeout: 10000
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/asata}
    # a NOINHERIT login role, member of oro_app and oro_system (see DbSession); never a superuser: it bypasses RLS
    username: ${SPRING_DATASOURCE_USERNAME:oro_service}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      connection-timeout: 5000
      validation-timeout: 3000
springdoc:
  api-docs:
    path: /doc/api
    version: openapi_3_0
  swagger-ui:
    operations-sorter: method
    path: /doc
    url: /doc/api
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      # the details (database...) to nobody: /actuator/health is public
      show-details: never
oro:
  security:
    cors-allowed-origins: ${ORO_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}
    products:
      # each product signs the access tokens of its users (HS256) with its own secret and issuer
      ORO:
        issuer: oro
        jwt-secret: ${ORO_JWT_SECRET:}
        integration-key: ${ORO_INTEGRATION_KEY:}
      UMOJA:
        # as Umoja issues them: umoja.security.jwt.issuer and UMOJA_JWT_SECRET of the Umoja backend
        issuer: umoja
        jwt-secret: ${UMOJA_JWT_SECRET:}
        integration-key: ${UMOJA_INTEGRATION_KEY:}
  outbox:
    enabled: ${ORO_OUTBOX_ENABLED:true}
    poll-interval: PT1S
    batch-size: 100
    lease: PT30S
    max-attempts: 10
    base-backoff: PT1S
    max-backoff: PT1H
    retention: P7D
    purge-interval: PT1H
  attachments:
    # 100 MiB; the database refuses more than 2 GiB anyway
    max-size-bytes: 104857600
    # local: the files on a disk (local-dir), for development and single-server installs; an object storage (s3...)
    # needs its FileStorage, until then nothing can be uploaded
    storage-provider: ${ORO_STORAGE_PROVIDER:local}
    local-dir: ${ORO_ATTACHMENTS_DIR:./data/attachments}
    # none: no malware scanner, a file is recorded clean unscanned (development only); anything else: the files stay
    # pending (not downloadable) until a scanner records its result
    scan: ${ORO_ATTACHMENTS_SCAN:none}
  live:
    # a comment on every stream, so that the proxies keep them open
    heartbeat: PT25S
