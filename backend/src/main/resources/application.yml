server:
  # 8080 Mokili, 8081 Umoja
  port: ${SERVER_PORT:8082}
  forward-headers-strategy: framework
  servlet:
    context-path: /oro
info:
  app:
    name: '@project.name@'
    version: '@project.version@'
    description: '@project.description@'
spring:
  application:
    name: Oro - Messaging
  servlet:
    multipart:
      # oro.attachments.max-size-bytes, and a little for the form
      max-file-size: 100MB
      max-request-size: 101MB
      # where an upload is received before it is stored: the data volume (ORO_MULTIPART_DIR), not the disk of the
      # system; unset: the temporary directory of the server. Deleted after each request
      location: ${ORO_MULTIPART_DIR:}
  mvc:
    async:
      # the streams (Server-Sent Events) end by themselves (LiveHub.STREAM_TIMEOUT)
      request-timeout: -1
  jpa:
    open-in-view: false
    hibernate:
      # the schema is the one of 1_ASATA_DATABASE/CREATE_ORO_TABLES.sql, never generated
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        query:
          timeout: 10000
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/asata}
    # the API's login: NOINHERIT, a member of oro_app only (see DbSession, DataSourceConfig); never a superuser: it
    # bypasses RLS
    username: ${SPRING_DATASOURCE_USERNAME:oro_api}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      connection-timeout: 5000
      validation-timeout: 3000
springdoc:
  # the API description and Swagger UI: off unless ORO_API_DOCS=true (development); never in production
  api-docs:
    enabled: ${ORO_API_DOCS:false}
    path: /doc/api
    version: openapi_3_0
  swagger-ui:
    enabled: ${ORO_API_DOCS:false}
    operations-sorter: method
    path: /doc
    url: /doc/api
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      # the details (database...) to nobody: /actuator/health is public
      show-details: never
oro:
  # the worker's login, for the integrations and the workers: NOINHERIT, a member of oro_system only; the same database
  system-datasource:
    driver-class-name: org.postgresql.Driver
    url: ${ORO_SYSTEM_DATASOURCE_URL:${spring.datasource.url}}
    username: ${ORO_SYSTEM_DATASOURCE_USERNAME:oro_worker}
    password: ${ORO_SYSTEM_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000
      validation-timeout: 3000
  security:
    cors-allowed-origins: ${ORO_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}
    products:
      # integration-keys: the keys of each product's trusted integration (/internal), as name:sha256 (the SHA-256 of the
      # key in hex, never the key: printf %s "$KEY" | shasum -a 256), comma separated; two during a rotation
      # each product signs the access tokens of its users (RS256) with its own private key; Oro reads its public keys
      # (a JWK set) and checks the issuer and the audience oro. Unset: that product's users cannot call Oro
      ORO:
        issuer: oro
        # Oro's account system, to come
        jwk-set-uri: ${ORO_JWKS_URI:}
        integration-keys: ${ORO_INTEGRATION_KEYS:}
      UMOJA:
        # as Umoja issues them: umoja.security.jwt.issuer, and its keys on /umoja/.well-known/jwks.json
        issuer: umoja
        jwk-set-uri: ${UMOJA_JWKS_URI:http://localhost:8081/umoja/.well-known/jwks.json}
        integration-keys: ${UMOJA_INTEGRATION_KEYS:}
  # how many requests a user makes (its token: issuer and subject), in this instance: per-minute a minute after a burst;
  # any for every request, the others on top. Over: 429 and Retry-After
  rate-limits:
    enabled: ${ORO_RATE_LIMITS:true}
    limits:
      any: { per-minute: 300, burst: 100 }
      send: { per-minute: 60, burst: 20 }
      change-message: { per-minute: 30, burst: 10 }
      react: { per-minute: 60, burst: 20 }
      typing: { per-minute: 30, burst: 5 }
      search: { per-minute: 20, burst: 5 }
      open-direct: { per-minute: 20, burst: 10 }
      create-group: { per-minute: 3, burst: 5 }
      add-member: { per-minute: 30, burst: 20 }
      upload: { per-minute: 10, burst: 5 }
      stream: { per-minute: 10, burst: 5 }
  outbox:
    enabled: ${ORO_OUTBOX_ENABLED:true}
    poll-interval: PT1S
    batch-size: 100
    lease: PT30S
    max-attempts: 10
    base-backoff: PT1S
    max-backoff: PT1H
    retention: P7D
    purge-interval: PT1H
  attachments:
    # 100 MiB; the database refuses more than 2 GiB anyway
    max-size-bytes: 104857600
    # local: the files on a disk (local-dir), for development and single-server installs; an object storage (s3...)
    # needs its FileStorage, until then nothing can be uploaded
    storage-provider: ${ORO_STORAGE_PROVIDER:local}
    local-dir: ${ORO_ATTACHMENTS_DIR:./data/attachments}
    # clamav: each file is scanned by clamd (below) before it is downloadable, fail closed (pending while clamd is away,
    # scanned again every minute; infected: refused and deleted). none: no scanner, a file is recorded clean unscanned
    # (development only, never in production)
    scan: ${ORO_ATTACHMENTS_SCAN:none}
    clamav:
      host: ${ORO_CLAMAV_HOST:localhost}
      port: ${ORO_CLAMAV_PORT:3310}
      # a file of max-size-bytes, scanned; clamd's StreamMaxLength, MaxFileSize and MaxScanSize must cover it too
      timeout: PT2M
      retry-interval: PT1M
    # what a user may upload: the bytes of its files not deleted, its files of the last 24 hours (413, 429 beyond)
    quota:
      bytes-per-user: ${ORO_ATTACHMENTS_QUOTA_BYTES:1073741824}
      files-per-day: ${ORO_ATTACHMENTS_QUOTA_FILES_PER_DAY:200}
    # the files Oro no longer keeps, removed every interval: of deleted messages at once, uploads never attached after
    # abandoned-after, uploads never received after pending-after; the files without an attachment every day
    purge:
      enabled: ${ORO_ATTACHMENTS_PURGE:true}
      interval: PT15M
      abandoned-after: PT24H
      pending-after: PT1H
    # the local storage keeps this much of its disk free (503 beyond)
    local-min-free-bytes: ${ORO_ATTACHMENTS_MIN_FREE_BYTES:1073741824}
  live:
    # a comment on every stream, so that the proxies keep them open
    heartbeat: PT25S
    # the streams of a user (its tabs and devices), and of this instance: the next one is refused (429, 503)
    max-streams-per-user: 5
    max-streams: 10000
