# the actuator on the port of the API in the tests (MockMvc)
management:
  server:
    port: ""
# the datasources (a Testcontainers PostgreSQL 17, logins oro_api and oro_worker) are set by PostgresIntegrationTest
spring:
  datasource:
    hikari:
      maximum-pool-size: 8
oro:
  security:
    products:
      # the public keys (TestTokens, new for each run) are set by PostgresIntegrationTest
      ORO:
        # the SHA-256 of test-oro-integration-key-for-the-tests-0123456789
        integration-keys: test:cb423df979dc9082007cd5c2e75779a2a9084fe6f2d8dccf4b94e7e64d10470e
      UMOJA:
        jwk-set-uri: ""
        # test-umoja-integration-key-for-the-tests-0123456789, and the next key of a rotation
        integration-keys: current:7a7ef43de33ac9c192f8801d62e3de31a4d5b42e381e0da525c6440f7c28794d, next:584c7a3838c1ff924c227bf768f18e9f5e3799bf079255ed4be400e785d5cb38
  attachments:
    storage-provider: local
    local-dir: target/test-attachments
    scan: none
    # the tests run the purge by hand
    purge:
      enabled: false
  outbox:
    # the tests run the worker by hand
    enabled: false
    lease: PT30S
    max-attempts: 3
    base-backoff: PT10S
  # short, so that the tests of the timeouts run fast
  database:
    user:
      statement-timeout: 2s
      lock-timeout: 1s
