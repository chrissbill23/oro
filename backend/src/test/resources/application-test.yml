# the datasources (a Testcontainers PostgreSQL 17, logins oro_api and oro_worker) are set by PostgresIntegrationTest
spring:
  datasource:
    hikari:
      maximum-pool-size: 8
oro:
  security:
    products:
      # the public keys (TestTokens, new for each run) are set by PostgresIntegrationTest
      ORO:
        integration-key: test-oro-integration-key-for-the-tests-0123456789
      UMOJA:
        jwk-set-uri: ""
        integration-key: test-umoja-integration-key-for-the-tests-0123456789
  attachments:
    storage-provider: local
    local-dir: target/test-attachments
    scan: none
  outbox:
    # the tests run the worker by hand
    enabled: false
    lease: PT30S
    max-attempts: 3
    base-backoff: PT10S
  # short, so that the tests of the timeouts run fast
  database:
    user:
      statement-timeout: 2s
      lock-timeout: 1s
