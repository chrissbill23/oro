# Oro backend (messaging). The database is the one shared by the services of Asata
# (../../1_ASATA_DATABASE/docker-compose.yml), with the Oro tables and the logins oro_api and oro_worker: start it first.
#   docker compose -f ../../1_ASATA_DATABASE/docker-compose.yml up -d
#   docker compose up --build
#   docker compose --env-file .env.local up --build
# Settings in .env.local (git ignored): the integration keys, the port. The tokens of the users are checked with the
# public keys of their product (UMOJA_JWKS_URI): Oro holds no secret that could sign one. API: http://localhost:8082/oro   Swagger UI: http://localhost:8082/oro/doc
name: oro

services:
  oro:
    build: .
    environment:
      # the shared database, on the network asataDB
      SPRING_DATASOURCE_URL: jdbc:postgresql://asata-postgres:5432/asata
      # never a superuser (it bypasses row-level security): the NOINHERIT logins of oro/INSERT.sql, whose development
      # passwords are placeholders; set ORO_DB_PASSWORD and ORO_WORKER_DB_PASSWORD for any other database.
      # The API's login (oro_app only) serves the users; the worker's (oro_system only) the integrations and workers.
      SPRING_DATASOURCE_USERNAME: ${ORO_DB_USERNAME:-oro_api}
      SPRING_DATASOURCE_PASSWORD: ${ORO_DB_PASSWORD:-oro_api_dev}
      ORO_SYSTEM_DATASOURCE_USERNAME: ${ORO_WORKER_DB_USERNAME:-oro_worker}
      ORO_SYSTEM_DATASOURCE_PASSWORD: ${ORO_WORKER_DB_PASSWORD:-oro_worker_dev}
      ORO_OUTBOX_ENABLED: ${ORO_OUTBOX_ENABLED:-true}
      # Swagger UI on /oro/doc: development only, set ORO_API_DOCS=false in production
      ORO_API_DOCS: ${ORO_API_DOCS:-true}
      # the tokens of the users: the public keys of each product (empty: that product's users cannot call Oro); Oro
      # holds no secret of theirs. Umoja's, on the shared network
      UMOJA_JWKS_URI: ${UMOJA_JWKS_URI:-http://umoja:8080/umoja/.well-known/jwks.json}
      ORO_JWKS_URI: ${ORO_JWKS_URI:-}
      # the keys of the trusted integrations of the products (/internal)
      # name:sha256 of each key, comma separated (two during a rotation); never the keys themselves
      ORO_INTEGRATION_KEYS: ${ORO_INTEGRATION_KEYS:-}
      UMOJA_INTEGRATION_KEYS: ${UMOJA_INTEGRATION_KEYS:-}
      ORO_CORS_ALLOWED_ORIGINS: ${ORO_CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:4201}
      # the uploads are received on the volume of the attachments, not on the disk of the container
      ORO_MULTIPART_DIR: /data/attachments/.incoming
      # every file scanned by clamd before it can be downloaded (none: development without a scanner, never in production)
      ORO_ATTACHMENTS_SCAN: ${ORO_ATTACHMENTS_SCAN:-clamav}
      ORO_CLAMAV_HOST: clamav
    volumes:
      # the files of the attachments (local storage), kept across rebuilds
      - attachments:/data/attachments
    networks:
      default:
      asata:
        # how Umoja (its backend, the nginx of its frontend) finds Oro on the shared network
        aliases:
          - oro
    # until the shared database accepts connections
    restart: on-failure
    ports:
      # on this machine only: the browsers reach Oro through the proxy of a product (Umoja's nginx), and Umoja's backend
      # on the network asataDB; never published on every interface (/internal would be reachable)
      - "127.0.0.1:${ORO_PORT:-8082}:8082"

  # the malware scanner of the attachments (clamd on 3310, this network only). Its first start downloads the signatures
  # (a few minutes, kept in a volume); about 1.5 GB of memory. Meanwhile the uploads wait, pending
  clamav:
    image: clamav/clamav:1.5.4-debian13-slim
    environment:
      # what clamd scans covers oro.attachments.max-size-bytes (100 MiB)
      CLAMD_CONF_StreamMaxLength: 110M
      CLAMD_CONF_MaxFileSize: 110M
      CLAMD_CONF_MaxScanSize: 220M
    volumes:
      - clamav-signatures:/var/lib/clamav
    restart: unless-stopped

volumes:
  attachments:
  clamav-signatures:

networks:
  # created by ../../1_ASATA_DATABASE/docker-compose.yml
  asata:
    external: true
    name: asataDB
